<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Payday Countdown</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .box {
      max-width: 400px;
    }
    h1 { font-size: 24px; margin-bottom: 12px; }
    p { color: #94a3b8; margin-bottom: 20px; }
    img { width: 80px; margin-bottom: 20px; }
    button {
      background: #3b82f6;
      border: none;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="box">
    <img src="/payday-countdown-manager/icon-192.png" alt="PD">
    <h1>You're Offline</h1>
    <p>Payday Countdown works offline. If this is your first time, connect to internet once to load the app.</p>
    <button onclick="location.reload()">Try Again</button>
  </div>
</body>
</html>
