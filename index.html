<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>Payday Countdown</title>
  <link rel="manifest" href="/payday-countdown-manager/manifest.json">
  <link rel="icon" href="/payday-countdown-manager/icon-192.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a; 
      color: #e2e8f0; 
      padding: 20px;
      min-height: 100vh;
    }
    .container { max-width: 500px; margin: 0 auto; }
    h1 { font-size: 28px; margin-bottom: 20px; text-align: center; }
    .card { 
      background: #1e293b; 
      border-radius: 12px; 
      padding: 20px; 
      margin-bottom: 16px;
    }
    .stat { font-size: 48px; font-weight: bold; text-align: center; margin: 10px 0; }
    .label { text-align: center; color: #94a3b8; font-size: 14px; }
    input, select, button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 16px;
    }
    button { 
      background: #3b82f6; 
      border: none; 
      cursor: pointer;
      font-weight: 600;
    }
    button:active { background: #2563eb; }
    .btn-danger { background: #ef4444; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>💰 Payday Countdown</h1>
    
    <div id="setup" class="card">
      <h2>Quick Setup</h2>
      <input type="number" id="salary" placeholder="Monthly salary" step="0.01">
      <select id="frequency">
        <option value="monthly">Monthly</option>
        <option value="biweekly">Bi-Weekly</option>
        <option value="weekly">Weekly</option>
      </select>
      <input type="date" id="nextPayday">
      <button onclick="saveSetup()">Start Tracking</button>
    </div>

    <div id="dashboard" class="hidden">
      <div class="card">
        <div class="stat" id="daysLeft">--</div>
        <div class="label">Days Until Payday</div>
      </div>
      
      <div class="card">
        <div class="stat" id="safeToSpend">$--</div>
        <div class="label">Safe To Spend Today</div>
      </div>

      <div class="card">
        <input type="number" id="amount" placeholder="Amount" step="0.01">
        <input type="text" id="note" placeholder="Note (optional)">
        <button onclick="addExpense()">Add Expense</button>
        <button onclick="addIncome()">Add Income</button>
        <button class="btn-danger" onclick="clearAllData()">Clear All Data</button>
      </div>
    </div>
  </div>

  <script>
    // SAFE DEFAULT DATA - prevents white screen crash
    let appData = {
      salary: 0,
      frequency: 'monthly',
      nextPayday: '',
      expenses: [],
      income: []
    };

    // Load data safely with fallbacks
    function loadData() {
      try {
        const saved = localStorage.getItem('paydayData');
        if (saved) {
          const parsed = JSON.parse(saved);
          appData = { ...appData, ...parsed }; // merge with defaults
        }
      } catch (e) {
        console.error('Failed to load data, using defaults:', e);
        localStorage.removeItem('paydayData');
      }
      return appData;
    }

    function saveData() {
      try {
        localStorage.setItem('paydayData', JSON.stringify(appData));
      } catch (e) {
        console.error('Failed to save:', e);
      }
    }

    function saveSetup() {
      const salary = parseFloat(document.getElementById('salary').value) || 0;
      const frequency = document.getElementById('frequency').value || 'monthly';
      const nextPayday = document.getElementById('nextPayday').value || '';
      
      if (!salary || !nextPayday) {
        alert('Please enter salary and next payday');
        return;
      }

      appData.salary = salary;
      appData.frequency = frequency;
      appData.nextPayday = nextPayday;
      saveData();
      showDashboard();
    }

    function showDashboard() {
      document.getElementById('setup').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
      updateDisplay();
    }

    function showSetup() {
      document.getElementById('setup').classList.remove('hidden');
      document.getElementById('dashboard').classList.add('hidden');
      // Pre-fill if data exists
      document.getElementById('salary').value = appData.salary || '';
      document.getElementById('frequency').value = appData.frequency || 'monthly';
      document.getElementById('nextPayday').value = appData.nextPayday || '';
    }

    function updateDisplay() {
      try {
        if (!appData.nextPayday) {
          showSetup();
          return;
        }

        const today = new Date();
        const payday = new Date(appData.nextPayday);
        const daysLeft = Math.max(0, Math.ceil((payday - today) / (1000 * 60 * 60 * 24)));
        
        const totalExpenses = (appData.expenses || []).reduce((sum, e) => sum + e.amount, 0);
        const totalIncome = (appData.income || []).reduce((sum, i) => sum + i.amount, 0);
        const remaining = appData.salary + totalIncome - totalExpenses;
        const safeToSpend = daysLeft > 0 ? (remaining / daysLeft) : remaining;

        document.getElementById('daysLeft').textContent = daysLeft;
        document.getElementById('safeToSpend').textContent = '$' + Math.max(0, safeToSpend).toFixed(2);
      } catch (e) {
        console.error('Display update failed:', e);
        showSetup();
      }
    }

    function addExpense() {
      const amount = parseFloat(document.getElementById('amount').value) || 0;
      const note = document.getElementById('note').value || '';
      if (amount <= 0) return alert('Enter amount');
      
      appData.expenses = appData.expenses || [];
      appData.expenses.push({ amount, note, date: new Date().toISOString() });
      saveData();
      document.getElementById('amount').value = '';
      document.getElementById('note').value = '';
      updateDisplay();
    }

    function addIncome() {
      const amount = parseFloat(document.getElementById('amount').value) || 0;
      const note = document.getElementById('note').value || '';
      if (amount <= 0) return alert('Enter amount');
      
      appData.income = appData.income || [];
      appData.income.push({ amount, note, date: new Date().toISOString() });
      saveData();
      document.getElementById('amount').value = '';
      document.getElementById('note').value = '';
      updateDisplay();
    }

    function clearAllData() {
      if (!confirm('Delete all data? This cannot be undone.')) return;
      localStorage.clear();
      appData = {
        salary: 0,
        frequency: 'monthly',
        nextPayday: '',
        expenses: [],
        income: []
      };
      showSetup();
    }

    // SAFE INIT - wraps everything in try/catch
    function initApp() {
      loadData();
      if (appData.salary && appData.nextPayday) {
        showDashboard();
      } else {
        showSetup();
      }
    }

    // Register service worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/payday-countdown-manager/service-worker.js');
      });
    }

    // Start app safely
    window.addEventListener('load', () => {
      try {
        initApp();
      } catch (e) {
        console.error('Critical error, resetting:', e);
        localStorage.clear();
        location.reload();
      }
    });
  </script>
</body>
</html>
