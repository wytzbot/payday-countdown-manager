<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>Payday Pro</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 16px;
      max-width: 480px;
      margin: 0 auto;
    }
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    .header h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .header p {
      color: #94a3b8;
      font-size: 14px;
    }
    .card {
      background: #1e293b;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .card-header {
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .card-value {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .card-sub {
      font-size: 14px;
      color: #94a3b8;
    }
    .progress-bg {
      background: #0f172a;
      height: 8px;
      border-radius: 4px;
      margin-top: 8px;
    }
    .progress-fill {
      background: #22c55e;
      height: 100%;
      border-radius: 4px;
      transition: width 0.3s ease;
    }
    .btn {
      width: 100%;
      padding: 14px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      margin-top: 8px;
      cursor: pointer;
    }
    .btn:active {
      background: #2563eb;
    }
    input {
      width: 100%;
      padding: 12px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 16px;
      margin-bottom: 12px;
    }
    .footer {
      text-align: center;
      margin-top: 32px;
      font-size: 12px;
      color: #64748b;
    }
    .footer a {
      color: #3b82f6;
      text-decoration: none;
    }
    .setup {
      display: none;
    }
    .setup.active {
      display: block;
    }
    .dashboard {
      display: none;
    }
    .dashboard.active {
      display: block;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Payday Pro</h1>
    <p>Track your money until next payday</p>
  </div>

  <div class="setup active" id="setup">
    <div class="card">
      <div class="card-header">Setup</div>
      <input type="number" id="salary" placeholder="Monthly Salary (NGN)" step="0.01">
      <input type="date" id="payday" placeholder="Next Payday">
      <button class="btn" onclick="saveSetup()">Start Tracking</button>
    </div>
  </div>

  <div class="dashboard" id="dashboard">
    <div class="card">
      <div class="card-header">DAYS UNTIL PAYDAY</div>
      <div class="card-value" id="days-left">0</div>
      <div class="card-sub" id="payday-date">Next payday: --</div>
    </div>

    <div class="card">
      <div class="card-header">AMOUNT LEFT</div>
      <div class="card-value" id="amount-left">₦0.00</div>
      <div class="progress-bg">
        <div class="progress-fill" id="progress-bar" style="width: 0%"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">SAFE TO SPEND TODAY</div>
      <div class="card-value" id="safe-today">₦0.00</div>
      <div class="card-sub" id="spent-today">₦0.00 spent of ₦0.00 today</div>
    </div>

    <div class="card">
      <div class="card-header">MONTHLY SAVINGS POTENTIAL</div>
      <div class="card-value" id="savings-potential">₦0.00</div>
      <div class="card-sub">If you spend ₦0 daily</div>
    </div>

    <button class="btn" onclick="resetApp()">Reset Setup</button>
  </div>

  <div class="footer">
    <a href="privacy.html">Privacy Policy</a> | <a href="terms.html">Terms of Service</a>
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js');
    }
  </script>
</body>
</html>
